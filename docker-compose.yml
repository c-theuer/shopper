# Local development: Postgres + backend + frontend, mirroring the Cloud Run setup.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopper
      POSTGRES_USER: shopper
      POSTGRES_PASSWORD: shopper
    ports: ["5433:5432"]  # 5433 avoids clashing with a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopper"]
      interval: 2s
      retries: 15

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PASSWORD: shopper
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8080"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      USE_ID_TOKEN: "false"
    ports: ["8080:8080"]
    depends_on: [backend]

volumes:
  pgdata:
