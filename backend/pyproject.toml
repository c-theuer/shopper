[project]
name = "shopper-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "anthropic>=1.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
]
